name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Native authority backend
        run: python -m pytest --tb=short -q tests/test_evaluation_asset_portability.py

      - name: Deterministic cross-process asset lock
        run: >-
          python -m pytest --tb=short -q
          tests/test_evaluation_asset_durability.py
          -k "spawned_process_holds_same_deterministic_asset_lock or
          spawned_lock_excludes_initialization_before_child_root_exists or
          revision_uses_same_asset_lock_and_preserves_bytes_when_busy or
          asset_lock_is_reentrant_for_nested_same_thread_callers"

      - name: Durable authority lifecycle
        run: >-
          python -m pytest --tb=short -q
          tests/test_evaluation_asset_durability.py
          -k "native_pre_receipt_faults_recompute_stage_eight_without_provider_rerun or
          native_receipt_and_wal_faults_reuse_stage_eight_and_provider_evidence or
          legacy_adoption_generation_fault_reclaims_staging_and_recovers or
          legacy_adoption_fault_phases_recover_as_one_terminal_operation or
          legacy_adoption_recovers_historical_crlf_control_files or
          legacy_adoption_recovery_rejects_crlf_to_lf_change_after_prepare or
          legacy_adoption_rejects_unsupported_control_serialization_before_writes or
          pr2_repeated_revisions_reclaim_exact_owned_hidden_nodes"

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: License headers
        run: python scripts/check_license_headers.py

      - name: Tenant docs contract
        run: python scripts/check_tenant_docs.py

      - name: Unit tests
        run: python -m pytest --tb=short -q
